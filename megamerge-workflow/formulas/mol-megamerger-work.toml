description = """
Guide the Gas City megamerger through related jj-line repairs with the
megamerge workflow.
"""
formula = "mol-megamerger-work"
version = 1

[[steps]]
id = "inventory-lines"
title = "Inventory related lines"
description = """
List the relevant jj lines, their descriptions, and the behavior each line owns.

Use `jj log --no-pager` with explicit revsets. Prefer change IDs over commit
hashes. Record which line owns each behavior before editing. Treat every stack
that must compile or behave together as in-scope, even if it is not a direct
topic parent yet.

Exit criteria:

- all related lines are listed
- each line has a named head revision to include in the megamerge
- intended ownership is written down
- obsolete or duplicate candidate lines are identified
"""

[[steps]]
id = "create-or-restage-megamerge"
title = "Create or restage megamerge"
needs = ["inventory-lines"]
description = """
Create a multi-parent merge if one does not exist, or restage the existing one
so it composes every relevant stack head. A graph drawing near the merge is not
proof that a stack is included; check ancestry explicitly.

```bash
jj new <line-a> <line-b> <line-c> -m "merge: reconcile <topic>"
```

When updating an existing megamerge, include the current megamerge parents plus
any missing stack heads:

```bash
jj new <existing-parent-a> <existing-parent-b> <missing-stack-head> -m "merge: reconcile <topic>"
```

Resolve conflicts in the merge until the integrated view is coherent. Then
create an empty scratch child above it:

```bash
jj new @ -m "wip: continue <topic> reconciliation"
```

Exit criteria:

- every relevant stack head is an ancestor of the merge
- direct parents are current stack heads, not stale interior commits
- scratch child is empty and current `@`
- `jj status` shows the scratch child has no changes
"""

[[steps]]
id = "prove-megamerge-membership"
title = "Prove megamerge membership"
needs = ["create-or-restage-megamerge"]
description = """
Before repair or verification, prove each intended stack is actually in the
megamerge ancestry.

```bash
jj log --no-pager -r '<stack-head> & ::<megamerge>'
jj log --no-pager -r '<megamerge> & <stack-head>::'
jj log --no-pager -r '<megamerge>-'
```

The first command must print the stack head. If it does not, that stack is not
in the megamerge. Restage the megamerge with the missing stack head included
before doing more repair work.

Exit criteria:

- every intended stack head is proven present in `::<megamerge>`
- the direct parent list is recorded
- any intentionally excluded stack is called out with the reason
"""

[[steps]]
id = "repair-in-scratch"
title = "Repair in scratch child"
needs = ["prove-megamerge-membership"]
description = """
Make remaining fixes in the scratch child, not by copying files to an unrelated
linear branch.

Use `jj-hunk list` to inspect hunk groups as work accumulates.

Exit criteria:

- fixes compile locally enough for hunk routing
- each hunk has an intended owning line
"""

[[steps]]
id = "route-hunks"
title = "Route hunks to owner lines"
needs = ["repair-in-scratch"]
description = """
Move hunks back into the parent line that owns them.

Use `jj absorb` when blame can route cleanly. Use `jj-hunk` or explicit
`jj squash --from @ --into <line> -m ...` when ownership is hunk-level or
ambiguous.

Exit criteria:

- scratch child is empty or contains only intentionally unresolved work
- owner lines contain their own fixes
- merge commit remains the integrated validation surface
"""

[[steps]]
id = "verify"
title = "Verify integrated view"
needs = ["route-hunks"]
description = """
Run focused build and tests from the integrated view.

Minimum build:

```bash
go build ./cmd/gc
```

For DoltLite bead work:

```bash
CGO_ENABLED=1 go test -tags gascity_doltlite_lib ./internal/beads -run 'TestDoltliteReadStore' -count=1 -timeout=120s
```

Exit criteria:

- build/test results are recorded
- remaining failing tests are attributed to either this work or existing repo state
"""

[[steps]]
id = "handoff"
title = "Handoff"
needs = ["verify"]
description = """
Summarize:

- merge change ID
- scratch child change ID
- parent stack heads and ownership
- proof that each intended stack head is in `::<merge>`
- hunks moved or intentionally left in scratch
- build/test results
- obsolete lines to abandon later
"""
