[pack]
name = "megamerge-workflow"
version = "0.1.0"
schema = 2
description = "Megamerger agent workflow for repairing several related Jujutsu lines together."

[imports.jj-hunk]
source = "../jj-hunk"

[providers.omp-megamerger]
