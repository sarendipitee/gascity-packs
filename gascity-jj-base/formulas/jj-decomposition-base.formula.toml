description = """
JJ document-workspace implementation of the decomposition-base methodology
contract.
"""
formula = "jj-decomposition-base"
version = 1
contract = "graph.v2"
extends = ["decomposition-base"]
target_required = false
internal = true

[vars]
[vars.docs_workspace]
description = "JJ workspace name that owns workflow documents."
default = "default"

[vars.docs_workspace_path]
description = "Absolute path to the default@ checkout used for workflow documents."
default = ""

[vars.docs_base_revset]
description = "Revset used to resolve the document checkout."
default = "default@"

[vars.docs_artifact_root]
description = "Artifact root inside the default@ checkout."
default = ""

[vars.manifest_path]
description = "Path to the workflow document manifest."
default = ""

[[steps]]
id = "describe-decomposition-change"
title = "Describe decomposition document change"
metadata = { "gc.run_target" = "gc.task-decomposer", "gc.jj.describe" = "true", "gc.jj.describe_scope" = "document", "gc.jj.describe_document" = "decomposition", "gc.docs.managed" = "true", "gc.docs.workspace_key" = "gc.docs.workspace,gc.var.docs_workspace", "gc.docs.workspace_path_key" = "gc.docs.workspace_path,gc.var.docs_workspace_path", "gc.docs.manifest_path_keys" = "gc.docs.manifest_path,gc.var.manifest_path" }
description_file = "../assets/workflows/jj-docs/describe-jj-change.md"

[[steps]]
id = "decompose"
title = "Write jj-managed task decomposition"
needs = ["describe-decomposition-change"]
metadata = { "gc.run_target" = "gc.task-decomposer", "gc.build.artifact_schema" = "gc.build.decomposition.v1", "gc.build.artifact_path_keys" = "gc.build.decomposition_path,gc.var.decomposition_path,gc.docs.decomposition.path", "gc.docs.managed" = "true", "gc.docs.document" = "decomposition", "gc.docs.document_schema" = "gc.build.decomposition.v1", "gc.docs.document_path_keys" = "gc.docs.decomposition.path,gc.build.decomposition_path,gc.var.decomposition_path", "gc.docs.manifest_path_keys" = "gc.docs.manifest_path,gc.var.manifest_path" }
description_file = "../assets/workflows/jj-docs/write-document.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"
